services:
  # ── API ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: delivery-api:latest
    container_name: delivery-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal
      - traefik-public
    # Маршрут через Docker labels, как принято в vps-server-infra для Docker-проектов
    # (docs/NEW-PROJECT.md, Вариант A). Пока в traefik/dynamic.yml есть такой же маршрут
    # lastmiles-api@file, оба ведут на этот контейнер; после проверки файловый
    # маршрут и lastmiles-api-svc из dynamic.yml нужно удалить.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.lastmiles-api.rule=Host(`api.lastmiles.ru`)"
      - "traefik.http.routers.lastmiles-api.entrypoints=websecure"
      - "traefik.http.routers.lastmiles-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.lastmiles-api.loadbalancer.server.port=3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge
  # Внешняя сеть traefik — маршрут api.lastmiles.ru → delivery-api:3000
  traefik-public:
    external: true

volumes:
  redis_data:
  uploads:
