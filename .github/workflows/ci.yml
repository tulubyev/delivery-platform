name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Деплоя в этом workflow нет намеренно: на VPS он делается вручную (см. CLAUDE.md,
# раздел «Команды»): `git pull`, `docker compose up -d --build api`, сборка фронта.
# Прежний job «Deploy to VPS» ходил в /opt/delivery-platform, сервис nginx и
# docker-том, которых на сервере нет, и никогда не мог отработать.

jobs:
  # ── Type-check + lint ────────────────────────────────────────────────────
  check:
    name: Type-check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # --ignore-scripts skips Prisma's postinstall and nothing builds the
      # workspace package, so both have to happen before tsc can see them.
      - name: Build @delivery/shared
        run: pnpm --filter @delivery/shared build

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Type-check API
        run: pnpm --filter api exec tsc --noEmit

      - name: Type-check Web
        run: pnpm --filter web exec tsc --noEmit

  # ── Проверка, что Docker-образы собираются ───────────────────────────────
  # Образы не публикуются (их никто не использует: сервер собирает API сам, фронт
  # собирается pnpm-ом в /var/www/lastmiles/apps/web/dist). Задача джоба: поймать
  # поломку Dockerfile до merge, а не при деплое. Запускается и на PR.
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build Web (static files)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: builder
          push: false
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
